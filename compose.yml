name: "php"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  php:
    image: "11notes/php:8.2.35"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
    networks:
      frontend:
    volumes:
      - "php.etc:/php/etc"
      - "php.var:/php/var"
    tmpfs:
      # require for read-only container
      - "/php/run:uid=1000,gid=1000"
    restart: "always"

volumes:
  php.etc:
  php.var:

networks:
  frontend: